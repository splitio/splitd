pipeline:
  name: splitd_ci
  identifier: splitd_ci
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        # GitHub connector (same as deploy_qos_v3). Without this, Harness defaults
        # to Harness Code (git0.harness.io) and cloneCodebase fails.
        connectorRef: fmegithubrunnersci
        repoName: splitd
        build: <+input>
        sparseCheckout: []
        depth: 0   # full clone → version_validation can see all existing tags
  stages:
    - stage:
        name: CI
        identifier: CI
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  identifier: set_version
                  name: Set VERSION
                  type: Run
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.26.1
                    shell: Sh
                    # MUST `export` — Harness only captures an exported outputVariable.
                    command: |
                      export VERSION="$(cat splitio/version.go | grep 'Version =' | awk '{print $4}' | tr -d '"')"
                      echo "VERSION=$VERSION"
                    outputVariables:
                      - name: VERSION
              - step:
                  identifier: version_validation
                  name: Version validation
                  type: Run
                  # PR-only: fail if the release tag already exists (forces a version bump).
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.26.1
                    shell: Sh
                    command: |
                      VERSION="<+steps.set_version.output.outputVariables.VERSION>"
                      git fetch --tags --quiet
                      if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
                        echo "[ERROR] Tag v${VERSION} already exists."
                        exit 1
                      fi
                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "PR"
              - step:
                  identifier: build
                  name: Build binaries
                  type: Run
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.26.1
                    shell: Sh
                    command: make splitd splitcli
              - step:
                  identifier: test
                  name: Run tests
                  type: Run
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.26.1
                    shell: Sh
                    # `make test` runs unit-tests + entrypoint-test; the latter
                    # (infra/entrypoint.sh + test_entrypoint.sh) needs jq and yq,
                    # which the golang image lacks (GHA ubuntu-latest had them
                    # preinstalled). Install both before running.
                    command: |
                      apt-get update -qq && apt-get install -y -qq --no-install-recommends jq
                      curl -sSLo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
                      chmod +x /usr/local/bin/yq
                      make test
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: "coverage.out"
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/*_test.go,**/vendor/**"
              - step:
                  identifier: cross_build
                  name: Cross build release binaries
                  type: Run
                  # Produces the 5 .bin artifacts uploaded by github_release. Same stage
                  # → same workspace (VERIFY), so binaries are on disk downstream.
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.26.1
                    shell: Sh
                    command: make binaries_release
              - step:
                  identifier: git_tag
                  name: Create git tag
                  type: Run
                  # push-to-main only: create + push v<VERSION>. Token must not be echoed.
                  # Uses fme-github-netrc-token — proven to auth against splitio/splitd
                  # (post_quality_gate posts commit statuses with it). VERIFY it has
                  # contents write (tag push) on the controlled release test.
                  spec:
                    connectorRef: dockerhub
                    image: alpine/git
                    shell: Sh
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("fme-github-netrc-token")>
                    command: |
                      VERSION="<+steps.set_version.output.outputVariables.VERSION>"
                      git config user.email "fme-ci@split.io"
                      git config user.name "splitd CI"
                      git tag "v${VERSION}"
                      git push "https://x-access-token:${GITHUB_TOKEN}@github.com/splitio/splitd.git" "v${VERSION}"
                  when:
                    stageStatus: Success
                    condition: <+trigger.event> == "PUSH"
              - step:
                  identifier: github_release
                  name: Create GitHub Release
                  type: Run
                  # push-to-main only: create the Release via the GitHub REST API and
                  # upload the 5 .bin assets from the same-stage workspace.
                  # NOTE: the plugins/github-release Drone plugin only runs on TAG-event
                  # builds ("github release plugin is only available for tags"). This is a
                  # push-to-branch build, so we call the API directly (same curl pattern
                  # as post_quality_gate). The tag itself is created by the git_tag step.
                  spec:
                    connectorRef: dockerhub
                    image: alpine/curl
                    shell: Sh
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("fme-github-netrc-token")>
                    command: |
                      set -e
                      VERSION="<+steps.set_version.output.outputVariables.VERSION>"
                      TAG="v${VERSION}"
                      REPO="splitio/splitd"
                      API="https://api.github.com/repos/${REPO}/releases"

                      # helper: extract the numeric release id from a JSON body (no python/jq).
                      extract_id() { grep -o '"id"[ ]*:[ ]*[0-9]*' | head -1 | grep -o '[0-9]*'; }

                      # Create the release for the tag git_tag already pushed.
                      RESP=$(curl -s -X POST \
                        -H "Authorization: token ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github+json" \
                        "${API}" \
                        -d "{\"tag_name\":\"${TAG}\",\"name\":\"splitd-${VERSION}\"}")
                      RELEASE_ID=$(printf '%s' "$RESP" | extract_id)

                      # If it already exists (re-run on same tag), fetch its id instead of failing.
                      if [ -z "$RELEASE_ID" ]; then
                        echo "Create returned no id (may already exist); looking it up..."
                        RELEASE_ID=$(curl -s \
                          -H "Authorization: token ${GITHUB_TOKEN}" \
                          -H "Accept: application/vnd.github+json" \
                          "${API}/tags/${TAG}" | extract_id)
                      fi
                      if [ -z "$RELEASE_ID" ]; then
                        echo "Failed to create or find release for ${TAG}:"; echo "$RESP"; exit 1
                      fi
                      echo "Release id=${RELEASE_ID} for ${TAG}"

                      # Upload the 5 .bin assets produced by cross_build (same workspace).
                      for f in \
                        "splitd-darwin-amd64-${VERSION}.bin" \
                        "splitd-darwin-arm-${VERSION}.bin" \
                        "splitd-linux-amd64-${VERSION}.bin" \
                        "splitd-linux-amd64-fips-${VERSION}.bin" \
                        "splitd-linux-arm-${VERSION}.bin"; do
                        if [ ! -f "$f" ]; then echo "MISSING artifact: $f"; exit 1; fi
                        echo "Uploading ${f}..."
                        curl -s -X POST \
                          -H "Authorization: token ${GITHUB_TOKEN}" \
                          -H "Content-Type: application/octet-stream" \
                          --data-binary @"${f}" \
                          "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${f}" \
                          -o /dev/null -w "  ${f}: HTTP %{http_code}\n"
                      done
                  when:
                    stageStatus: Success
                    condition: <+trigger.event> == "PUSH"
