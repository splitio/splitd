inputSet:
  name: splitd_hc
  tags: {}
  identifier: splitd_hc
  description: Harness Code PR builds (trigger splitd_hc_pr). Same as splitd_unstable, but clones the Harness Code PR and tags <head7> / <head7>-m<main7> (no latest).
  orgIdentifier: PROD
  projectIdentifier: Harness_Split
  pipeline:
    identifier: deploy_qos_v3
    stages:
      - stage:
          identifier: code_artifact
          type: Deployment
          spec:
            service:
              serviceRef: <+<+expression.isResolved(<+trigger.payload.repository.name>)>?<+trigger.payload.repository.name.replace("-", "")>:<+trigger.payload.artifacts[0].service.replace("-", "")>>
      - parallel:
          - stage:
              identifier: CI
              type: CI
              spec:
                execution:
                  steps:
                    - step:
                        identifier: custom_tag
                        type: Run
                        spec:
                          command: |-
                            # Harness Code PR clone = checkout main + `git merge <PR head>`:
                            #  - fast-forward (HEAD == PR head): image == PR head    -> <head7>
                            #  - real merge (HEAD^2 == PR head):  PR head + main HEAD^1 -> <head7>-m<main7>
                            # so builds of the same PR against different main commits never share a tag.
                            HEAD_SHA="<+codebase.commitSha>"
                            case "$HEAD_SHA" in
                              ""|null|"<+"*) echo "[ERROR] PR head commit SHA not resolved: '$HEAD_SHA'"; exit 1 ;;
                            esac
                            HEAD7="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
                            if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
                              VERSION="$HEAD7"
                            elif [ "$(git rev-parse -q --verify 'HEAD^2')" = "$HEAD_SHA" ]; then
                              VERSION="${HEAD7}-m$(git rev-parse --short=7 'HEAD^1')"
                            else
                              echo "[ERROR] PR head ${HEAD_SHA} is neither HEAD nor HEAD^2 of the checkout"; exit 1
                            fi
                            echo "PR head ${HEAD_SHA}, checkout HEAD $(git rev-parse HEAD) -> image tag ${VERSION}"

                            # Logging to DockeHub
                            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

                            # Install the necessary QEMU binaries for multi-platform builds
                            docker run --privileged --rm tonistiigi/binfmt --install all
                          envVariables:
                            DOCKERHUB_USERNAME: infrasplit
                            DOCKERHUB_TOKEN: <+secrets.getValue("dockerhub-infrasplit-token")>
                        when:
                          condition: "true"
                    - step:
                        identifier: BuildAndPush
                        type: BuildAndPushDockerRegistry
                        spec:
                          repo: splitd/sidecar<+<+matrix.fips_mode>=="enabled"?"-fips":"">
                          tags:
                            - <+pipeline.stages.CI<+strategy.identifierPostFix>.spec.execution.steps.custom_tag.output.outputVariables.VERSION>
                          dockerfile: infra/sidecar.Dockerfile
                          context: ""
                          buildArgs:
                            FIPS_MODE: <+matrix.fips_mode>
                          envVariables:
                            PLUGIN_PLATFORM: linux/amd64,linux/arm64
              strategy:
                matrix:
                  fips_mode:
                    - enabled
                    - disabled
          - stage:
              identifier: ECR
              type: CI
              spec:
                execution:
                  steps:
                    - step:
                        identifier: custom_tag
                        type: Run
                        spec:
                          command: |-
                            # Harness Code PR clone = checkout main + `git merge <PR head>`:
                            #  - fast-forward (HEAD == PR head): image == PR head    -> <head7>
                            #  - real merge (HEAD^2 == PR head):  PR head + main HEAD^1 -> <head7>-m<main7>
                            # so builds of the same PR against different main commits never share a tag.
                            HEAD_SHA="<+codebase.commitSha>"
                            case "$HEAD_SHA" in
                              ""|null|"<+"*) echo "[ERROR] PR head commit SHA not resolved: '$HEAD_SHA'"; exit 1 ;;
                            esac
                            HEAD7="$(printf '%s' "$HEAD_SHA" | cut -c1-7)"
                            if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
                              VERSION="$HEAD7"
                            elif [ "$(git rev-parse -q --verify 'HEAD^2')" = "$HEAD_SHA" ]; then
                              VERSION="${HEAD7}-m$(git rev-parse --short=7 'HEAD^1')"
                            else
                              echo "[ERROR] PR head ${HEAD_SHA} is neither HEAD nor HEAD^2 of the checkout"; exit 1
                            fi
                            echo "PR head ${HEAD_SHA}, checkout HEAD $(git rev-parse HEAD) -> image tag ${VERSION}"

                            # Logging to DockeHub
                            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

                            # Install the necessary QEMU binaries for multi-platform builds
                            docker run --privileged --rm tonistiigi/binfmt --install all
                          envVariables:
                            DOCKERHUB_USERNAME: infrasplit
                            DOCKERHUB_TOKEN: <+secrets.getValue("dockerhub-infrasplit-token")>
                        when:
                          condition: "true"
                    - step:
                        identifier: BuildAndPushECR
                        type: BuildAndPushECR
                        spec:
                          imageName: splitd/sidecar<+<+matrix.fips_mode>=="enabled"?"-fips":"">
                          tags:
                            - <+pipeline.stages.ECR<+strategy.identifierPostFix>.spec.execution.steps.custom_tag.output.outputVariables.VERSION>
                          dockerfile: infra/sidecar.Dockerfile
                          context: ""
                          buildArgs:
                            FIPS_MODE: <+matrix.fips_mode>
                          envVariables:
                            PLUGIN_PLATFORM: linux/amd64,linux/arm64
              strategy:
                matrix:
                  fips_mode:
                    - enabled
                    - disabled
      - stage:
          identifier: deploy
          type: Deployment
          spec:
            services:
              values: <+input>
              metadata:
                parallel: <+input>
    properties:
      ci:
        codebase:
          # "" = Harness Code: clone the HC PR (checks are reported on the HC PR).
          connectorRef: ""
          build:
            type: PR
            spec:
              number: <+trigger.payload.pull_req.number>
